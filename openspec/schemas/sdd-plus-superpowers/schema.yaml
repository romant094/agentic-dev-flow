name: sdd-plus-superpowers
version: 1
description: >
  Spec-driven workflow integrated with Superpowers skills.
  brainstorm → proposal → specs → tasks → plan → verify → review.
  design is optional (produced from brainstorm but not required by tasks).
  Apply phase uses git worktrees + subagent-driven-development
  (brings a fresh implementer and a code review per task; test-first
  development only where the plan text calls for it). executing-plans is
  documented only as a fallback for platforms without subagent support.

artifacts:
  - id: brainstorm
    generates: brainstorm.md
    description: Collaborative design exploration using Superpowers brainstorming
    template: brainstorm.md
    instruction: |
      Use the Skill tool to invoke **superpowers:brainstorming**.

      IMPORTANT output redirection:
      - Do NOT write to `docs/superpowers/specs/`. Instead, write the
        brainstorming design output directly to this change's `brainstorm.md`.
      - If brainstorming produces a design document, also write it to
        this change's `design.md` (this will pre-fill the design artifact).

      After brainstorming completes, summarize the agreed design in
      brainstorm.md using the template structure.

      The brainstorming skill will:
      1. Explore project context
      2. Ask clarifying questions (one at a time)
      3. Propose 2-3 approaches with trade-offs
      4. Present design sections for approval
      5. Output the validated design
    requires: []

  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document based on the brainstorming output.

      Read brainstorm.md for the validated design. Extract:
      - **Why**: The motivation (from brainstorming discussion)
      - **What Changes**: Specific changes agreed upon
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Check `openspec/specs/` for existing spec names.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      Since brainstorming already explored the problem space,
      this should be a concise extraction, not a new exploration.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Each capability listed here will need a spec file.

      Keep it concise (1-2 pages). Focus on the "why" not the "how".
    requires:
      - brainstorm

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document explaining HOW to implement the change.

      Check if brainstorming already produced a design.md file.
      If design.md already exists with content from brainstorming,
      review and refine it rather than starting from scratch.

      If design.md is empty or doesn't exist, create it from
      the brainstorm.md output.

      Sections:
      - **Context**: Background, current state, constraints, stakeholders
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Outstanding decisions or unknowns to resolve

      Focus on architecture and approach, not line-by-line implementation.
      Good design docs explain the "why" behind technical decisions.
    requires:
      - brainstorm

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      Create one spec file per capability listed in the proposal's Capabilities section.
      - New capabilities: use the exact kebab-case name from the proposal (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from openspec/specs/<capability>/ when creating the delta spec at specs/<capability>/spec.md.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)

      Reference specs for what needs to be built. If design.md exists,
      reference it for how to build it — but design is optional (see
      openspec-conventions: design.md is only for changes that need to
      explain non-trivial technical decisions).

      **Granularity — tasks.md answers "what", not "how".**

      One checkbox is one independently reviewable deliverable, stated in domain
      terms. Do NOT put source file paths or test commands in tasks.md — they
      belong in plan.md, and duplicating them means they drift.

      **Investigate before you checkbox — don't let the apply phase discover
      scope one fix at a time.** Each checkbox becomes one implementer dispatch
      in the apply phase (subagent-driven-development, one fresh subagent per
      task). Splitting a domain into more checkboxes than it needs means more
      cold-start subagent round trips later, so decide checkbox boundaries with
      the domain's full scope in view, not just the first symptom found:

      - **Cascading domains**: if a file or test suite might have more than one
        thing wrong with it (a fix to one assertion is likely to surface the
        next), read it in full — or, across several such files, dispatch
        read-only investigation in parallel via
        `superpowers:dispatching-parallel-agents` — before writing its
        checkbox. One checkbox then covers everything that domain needs, not
        the first fix found; a plan.md forced to grow mid-apply because a
        checkbox turned out incomplete is the signal this step was skipped.
      - **Mechanical, independent items**: several small, unrelated changes
        (one-line config edits, single-assertion fixes) that don't need
        isolated review attention can share one checkbox instead of one each.
      - Keep a checkbox on its own when the item is risky, large, or needs
        review attention isolated from its neighbors.
    requires:
      - specs

  - id: plan
    generates: plan.md
    description: Micro-task implementation plan using Superpowers writing-plans
    template: plan.md
    instruction: |
      Use the Skill tool to invoke **superpowers:writing-plans**.

      IMPORTANT output redirection:
      - Do NOT write to `docs/superpowers/plans/`. Instead, write
        the plan directly to this change's `plan.md`.

      The writing-plans skill will:
      1. Read the tasks.md and design.md for context
      2. Break each task into 2-5 minute micro-steps (TDD style)
      3. Include exact file paths, code snippets, test commands
      4. Add commit points after each task

      Pass the tasks.md content to the skill as the input for
      decomposition. The plan should reference the specs and
      design artifacts in this change directory.

      **Granularity — plan.md answers "how", and stays anchored to tasks.md.**

      Write one `### Task N` per tasks.md checkbox, in the same order. Each one
      MUST open with an explicit back-reference naming the checkbox it implements,
      for example `> Implements tasks.md 3.4.` Every task carries Files,
      Interfaces, and RED-GREEN-REFACTOR-commit steps.

      **Execution Graph — for plans whose tasks fall into independent groups.**

      When the plan's tasks partition into groups that touch different files or
      services, add an `## Execution Graph` section (see the plan.md template)
      before the first `### Task N`. For every pair of groups, score their
      coupling from the file sets in each group's tasks' `**Files:**` blocks: zero
      overlap is `none`; overlap limited to files neither group writes is `weak` or
      `medium`; any file both groups write is `strong` — this floor MUST NOT be
      lowered by judgment, only raised, when a shared contract couples groups whose
      files don't overlap. A `medium` score MUST state, inline, whether the overlap
      is high- or low-criticality — that reasoning, not a separate score, is what
      scheduling reads. Assign every group to wave 1 (may run in parallel with any
      other wave-1 group scored `none`/`weak`/low-criticality-`medium` against it,
      capped at 2-3 concurrent) or wave 2 (depends on one or more wave-1 groups, by
      explicit dependency or by `strong`/high-criticality-`medium` coupling that
      rules out sharing a wave). No group may depend on another wave-2 group — the
      graph has exactly two tiers. A plan with no independent groups needs no
      Execution Graph section; it runs as a single implicit wave-1 group, exactly as
      plans do today.

      plan.md MUST NOT introduce a deliverable that has no tasks.md checkbox. If
      the plan needs one, add the checkbox to tasks.md first.

      The back-reference is what makes drift visible between what the executor
      runs (plan.md) and what progress tracking counts (tasks.md).

      **Risk reconciliation — required before plan.md is done.** If this
      change's `design.md` has a Risks/Trade-offs section, plan.md is not
      complete until every risk listed there has an explicit line in plan.md
      naming which Task addresses it, or an explicit, reasoned statement that
      the risk is deferred and why. A task's own text MUST NOT contradict a
      named risk's stated mitigation, or a requirement in this change's
      `specs/` — if a task's instructions do either, rewrite the task before
      marking plan.md done. This check exists because a plan can be executed
      exactly as written and still violate the change's own spec if the plan
      text itself was wrong; catching that at plan-authoring time means
      neither the per-task review nor the final whole-implementation review
      has anything left to catch.
    requires:
      - tasks

  - id: verify
    generates: verify.md
    description: Post-implementation verification against specs, design, and tasks
    template: verify.md
    instruction: |
      Run the `/opsx:verify` command, which performs the checks below and
      writes verify.md from the template. The checks are mandatory and the
      command is their only sanctioned executor.

      IMPORTANT timing note:
      - Unlike other artifacts, verify.md is produced AFTER the apply
        phase completes, NOT during planning. The `requires: [plan]`
        edge exists only for schema graph purposes — the actual
        verification step MUST run on a completed implementation.

      The verify step MUST perform the following checks and record
      results in verify.md using the template:

      1. **Structural validation**: Run `openspec validate --all --json`
         in the repository root and confirm every item returns
         `"valid": true`. If any item fails, record the issues and
         return to fix the underlying artifact before proceeding.

      2. **Task completion**: Confirm every checkbox in tasks.md is
         `- [x]`. For any `- [ ]` remaining, document the reason
         (e.g. manual / out-of-scope / blocked) and whether it blocks
         archive.

      3. **Delta spec sync state**: For each directory under
         `openspec/changes/<name>/specs/`, compare against the
         corresponding `openspec/specs/<capability>/spec.md` and
         record one of:
         - ✓ Already synced
         - ✗ Needs sync (list the capabilities)
         - N/A (no delta specs produced)

      4. **Design/specs coherence**: Compare every decision in
         design.md against the requirements and scenarios in specs/.
         Do not sample, and do not stop at the artifacts: where a
         decision names a command, a script, a schema instruction or
         a skill, open that file and check the decision against what
         it actually does — including the skill a command hands
         control to. A row that cites only the file that already
         agrees with it is not evidence. Record drift between two
         documents as a warning (non-blocking). A contradiction
         between two executable surfaces is blocking and makes the
         verdict FAIL.

      5. **Implementation signal**: Confirm all code changes are
         committed (no unstaged files in the worktree). Cite the
         commit range if known.

      6. **The test suite for what this change touched**: First, check for an
         apply-time record. If `openspec/changes/<name>/.apply-test-record.md`
         exists, read its `**Commit:**` field and compare it to a scan of the
         whole repository for commits made since that SHA, not just the change
         directory — the record's own commit always lands inside
         `openspec/changes/<name>/`, so a pathspec scoped to that directory would
         always find at least one commit, and the commits that actually
         invalidate a test result usually land outside it (e.g. under
         `apps/server/`, `apps/client/`, `packages/shared/`):
         `git log --oneline <that SHA>..HEAD -- . ':(exclude)openspec/changes/<name>/.apply-test-record.md' ':(exclude)openspec/changes/<name>/verify.md'`
         (excluding only the record file and verify.md itself, since writing them
         is not implementation work). If this finds no commits, cite the record's
         `**Result:**` block verbatim as this check's result and skip re-running
         the tests — the apply-time run already answered this question against
         the current code. If at least one commit landed since that SHA, or the
         record does not exist, proceed as below: derive the affected
         packages from the `**Files:**` blocks in plan.md and run their tests
         together with their dependents. A change that touched no package
         records that and passes this check — the whole-suite run belongs to
         `/opsx:apply` and to CI, not here — there is no longer a pre-push
         hook. The run MUST NOT be answered from
         a build cache: a cached result is a replay of an earlier run against
         earlier code and MUST NOT be recorded as a pass. Record the real
         output — pass and fail counts, and the evidence nothing was replayed.
         A failure in a package this change touched is a blocking FAIL.

      7. **No leftover group worktree**: Run `git worktree list` and confirm it names
         no `.claude/worktrees/<TASK-ID>--group-*` path. If one remains, the change's
         apply phase stopped mid-fan-out — most likely a group is `BLOCKED` and
         unresolved. Record which group worktree remains and treat this as a blocking
         FAIL; it is not evidence of a completed apply regardless of what the other
         eight checks report.

      8. **Stale-skill check**: Compare the change's diff (the same commit range used by
         Checks 5 and 6) against every `.claude/skills/*/SKILL.md`'s documented scope
         (and its `README.md`/`manifest.json`, where present), to determine whether the
         change makes any skill's documented process or facts inaccurate.

         A skill that states, as current fact, a behavior the diff has changed MUST be
         classified CONFIRMED stale — this is a blocking FAIL. A plausible but
         unconfirmed candidate MUST be classified PLAUSIBLE and recorded as a
         non-blocking warning.

         No skill file MAY be edited to resolve a CONFIRMED finding without first
         posting the proposed edit to the developer, in chat, and receiving explicit
         approval. An explicit developer decline, recorded with its reasoning in
         verify.md, resolves the finding and allows verification to pass — silence or
         an unreviewed automatic edit MUST NOT be treated as resolution under any
         circumstance, regardless of how confident the CONFIRMED classification is.

         A change that touches no skill-relevant code records that and passes with no
         findings.

      9. **Workflow shape**: Run `node .claude/scripts/check-workflow-shape.mjs`.
         It derives the artifact list from this schema, the cycle's command list from
         `.claude/commands/opsx/` minus the non-cycle commands it names, and the check
         count from `templates/verify.md`, then compares that derived shape against the
         places that declare it: the cycle line, the stated artifact count and the
         artifact table in `.claude/CLAUDE.md`'s change-workflow section, the artifact
         sequence in this schema's own `description`, and
         `.claude/commands/opsx/verify.md`'s statement of how many sections and checks its
         report has. A declaration site that disagrees
         with the derived shape is a finding naming the site, what was derived and what
         the site states; a site whose anchor cannot be found is a finding too, so
         renaming a heading cannot switch a site off in silence.

         It deliberately does not scan documentation prose for numbers. A count beside
         `artifact`, `command` or `check` almost always counts a subset in English, and
         the artifact ids are ordinary words, so a prose scan measured against this
         repository produced ten findings of which every one was a false positive.
         Incidental prose is therefore not checked at all.

         A non-zero exit is a blocking FAIL: a surface describing a shape the workflow no
         longer has will mislead every later reader, and this class of drift has recurred
         five times in this repository.

         A change that adds a check MUST correct any count literal its own addition makes
         stale, in the same change — and this holds whether or not the check would have
         caught the literal, because the check covers the declaration sites named above
         rather than every mention.

      Verify MAY be re-run multiple times as the implementation is
      refined — each run overwrites verify.md with current state.

      If `/opsx:verify` cannot be run, STOP and report it. Do NOT run the nine
      checks by hand — an unverified change must not reach archive on the strength
      of an improvised check.
    requires:
      - plan

  - id: review
    generates: review.md
    description: AI code review of the implementation, with its fix rounds, run after verification
    template: review.md
    instruction: |
      Run the `/opsx:review` command. It dispatches the `ai-code-review` skill and
      writes review.md from the template. The command is the only sanctioned executor.

      IMPORTANT timing note:
      - Like verify.md, review.md is produced AFTER the apply phase completes, NOT
        during planning. The `requires: [verify]` edge is a graph edge and also a real
        ordering: a change is reviewed after it is verified, never before.

      The review MUST run the prompt at `infra/claude/review-prompt.md` verbatim,
      read at run time. It MUST NOT hold or restate a copy of it. That file is the same
      prompt the `ai_claude_inspect` CI job runs, and it is the only thing that keeps
      this stage and the merge-request gate in agreement. A local copy drifts, and the
      drift shows up as a local pass followed by a CI block.

      CRITICAL and HIGH findings are blocking and start a fix round. MEDIUM and LOW are
      recorded and never block. These are the prompt's own BLOCK / REQUEST CHANGES /
      APPROVE thresholds, and the CI gate applies the same ones.

      A fix subagent's claim that a finding is a false positive is a proposal, not an
      action. It MUST be put to the developer, and silence MUST NOT be treated as
      approval — the same rule verify's check 8 applies to stale-skill findings, for
      the same reason: an automatic dismissal is indistinguishable from a missed bug.
      An approved dismissal places a `// review-ignore: CWE-XXX — reason` marker on the
      line, which both the prompt and the CI review honour, so the suppression travels
      with the code rather than with the session.

      Rounds after the first re-review only the diff of the fixes, not the whole branch
      diff. The cap is three rounds; beyond that the record is BLOCKED and the
      outstanding findings are handed to the developer.

      review.md records dispositions, not finding bodies, and it records the SHA it
      reviewed. `/opsx:archive` refuses to archive without a PASS record whose commit is
      still HEAD.

      Review MAY be re-run as the implementation changes — each run overwrites
      review.md with current state.

      If `/opsx:review` cannot be run, STOP and report it. Do NOT review by hand: an
      improvised review that writes a PASS record unblocks archive on no evidence.
    requires:
      - verify

apply:
  requires: [plan]
  tracks: tasks.md
  instruction: |
    The change directory is already committed on the feature branch and the
    worktree already exists — both were established by `/opsx:propose`. Apply
    therefore starts by confirming isolation, not by creating it.

    0. **Pre-flight — Superpowers must be available**:

       Run `node .claude/scripts/check-superpowers.mjs`. If it exits non-zero,
       STOP, print its output verbatim, and modify nothing.

       Then run `node .claude/scripts/check-opsx-commands.mjs`. A non-zero exit
       means the opsx commands were regenerated and have lost the gate, the branch
       model and the worktree lifecycle. Stop and report it. Do not restore the
       files yourself and do not proceed with a degraded command surface.

    1. **Workspace**: The worktree already exists and `/opsx:apply` has already entered
       it and provisioned it — see that command's steps 3 and 4. Confirm where you are
       and move on:

       ```bash
       git rev-parse --show-toplevel
       git rev-parse --path-format=absolute --git-common-dir
       ```

       Two different repository roots mean you are inside the change's worktree, which
       is where every later step belongs. Equal roots mean the change was authored in
       place on the current branch, which is also allowed. Say which case you are in
       and continue.

       Do NOT invoke **superpowers:using-git-worktrees** here. Its Step 0 sends an
       agent that is already in a linked worktree to its Step 2, which runs
       `npm install` unconditionally; in this project a worktree's `node_modules` is a
       symlink into the main checkout, so that install rewrites the main checkout's
       dependency tree — `node_modules/.prisma/` included — for whatever branch the
       developer has open. In the authored-in-place case the same Step 0 offers to
       create a worktree under `.worktrees/`, a path this repository does not gitignore,
       and then commits a `.gitignore` edit of its own.

       Provisioning is decided and performed once, by `/opsx:apply` step 4: `npm ci`
       only when the change touches `prisma/`, `package.json` or `package-lock.json`;
       otherwise symlink `node_modules`, the three workspace `node_modules` directories
       and the root `.env` from the main checkout. `npm install` and `npm ci` are never
       run inside a worktree outside that one case.

    2. **Executor** — on Claude Code you should **always use 2a**.
       2b exists only as a fallback for platforms without subagent
       support; see the 2b section for details.

       **2a. Default — subagent-driven-development**:

       Use the Skill tool to invoke
       **superpowers:subagent-driven-development** to execute
       the plan.md micro-tasks with fresh subagents per task.

       If `plan.md` has an `## Execution Graph` section, dispatch by wave instead of
       running the whole plan as one sequential pass:

       - Read the Execution Graph's wave assignments before dispatching Task 1.
       - For wave 1, create one worktree per group at
         `.claude/worktrees/<TASK-ID>--group-<N>/`, branched from the change branch's
         current HEAD (`git worktree add .claude/worktrees/<TASK-ID>--group-<N> -b
         <change-branch>--group-<N> <change-branch>`). Launch at most 2-3 groups at
         once — issue their dispatches in the same controller response so they run
         concurrently (per superpowers:dispatching-parallel-agents); groups beyond the
         cap wait for a slot to free up. When the change was authored in place (no
         `<TASK-ID>` worktree, per apply step 1), root group worktrees the same way
         relative to the repo root, using the change branch name in place of
         `<TASK-ID>` in the path, and "the main worktree" below means the current
         working directory.
       - Inside each group's worktree, run **superpowers:subagent-driven-development**
         exactly as below, scoped to only that group's tasks.
       - As each group's own ledger shows every one of its tasks `complete`, merge its
         branch into the change branch (`git merge <change-branch>--group-<N>`, run
         from the main worktree). A conflict is resolved by a scoped subagent — any
         conflict, not only non-overlapping hunks — but the merge does not count as
         done until a mandatory scoped re-review of the merge diff passes, checking
         semantic compatibility, not just the absence of conflict markers. A
         load-bearing finding from that re-review is fixed forward: one fix dispatch
         plus one scoped re-review in the change branch, same mechanism as a task's own
         fix loop, never a merge rollback. Then remove the group's worktree
         (`git worktree remove .claude/worktrees/<TASK-ID>--group-<N>`).

         **After each task group merges, push the change branch** (`git push`, run in
         the main change worktree, never in a group worktree). This point is reached
         identically whether groups ran serially or in parallel waves. The push is a
         backup and a progress signal; the draft merge request runs no pipeline, so it
         gates nothing.
       - A group with no `## Execution Graph` entry runs exactly as today: one
         sequential subagent-driven-development pass in the main worktree, no group
         worktrees created.

       A plan with no `## Execution Graph` section at all runs exactly as today too:
       one sequential subagent-driven-development pass in the main worktree, no group
       worktrees created.
       - Once every wave-1 group this wave-2 group depends on (by the graph's stated
         dependency, or by having been kept out of wave 1 on coupling grounds) is
         merged and re-reviewed clean, start that wave-2 group the same way — its own
         worktree, its own subagent-driven-development pass, merge, re-review. Wave-2
         groups that are mutually independent may themselves run concurrently under the
         same cap; nothing depends on a wave-2 group, so there is no wave 3.

       A group whose own fix loop reaches subagent-driven-development's round-5 breaker
       with a load-bearing finding stays `BLOCKED`: do not remove its worktree, do not
       merge its branch, and report it without stopping other groups. Every other
       already-running or already-queued independent group continues to completion and
       merges normally. Only wave-2 groups that depend on the blocked group — by the
       graph's stated dependency, or by coupling that kept them out of its wave — wait
       for its resolution; independent wave-2 groups start as soon as their own
       dependencies are merged, regardless of the blocked group's state.

       Match the agent to the work: dispatch each task at the cheapest capability
       level that can execute it, a middle level for integration and debugging, and
       the highest available for architecture, adjudication and whole-branch review.
       Name the chosen level in the dispatch. Never name a model or vendor.

       Tell the executor:
       - Read plan.md in this change directory for micro-tasks
       - Update tasks.md checkboxes as coarse tasks complete
       - Work within the created worktree

       IMPORTANT — transitive skill activation:
       subagent-driven-development internally invokes the
       following skills, so you do NOT need to invoke them
       manually:
       - **superpowers:test-driven-development** — CONDITIONALLY.
         The skill's implementer prompt says "write tests
         (following TDD if task says to)", so a task whose plan.md
         text does not state RED and GREEN is implemented without a
         failing test first. Read plan.md and say which tasks are
         test-driven; if one should be and is not, correct the plan
         text before dispatching it.
       - **superpowers:requesting-code-review** — after each
         task, a code-reviewer subagent is dispatched to catch
         spec compliance and code quality issues. A final review
         runs for the entire implementation before apply
         concludes.

       Once `subagent-driven-development` returns — all tasks complete, all wave
       groups merged, its own final whole-implementation review already run —
       apply first ticks every completed checkbox in `tasks.md`. Control left this
       command while that skill ran, so this return is where the ticking gets done;
       `/opsx:verify` check 2 fails on an unticked box otherwise. Apply then runs
       the whole suite (`npm test -- --force`; `--force` is not optional,
       since a cached answer is a replay of an earlier run, not evidence about this
       one — confirm the output's `Cached:` line reads `0 cached`). This is the whole
       suite, not the packages this change touched, because it is the only point in
       the cycle where a cross-package or cross-group regression is visible: a task
       group's own checks see only the packages its `**Files:**` blocks name, and two
       groups that are each green in isolation can merge into a change branch that is
       not. A failure blocks, with one exception: a failure that also reproduces on
       `origin/develop` is pre-existing and is recorded as separate work rather than
       blocking this change — checked with a throwaway worktree against
       `origin/develop`, filtered to the failing package, then removed. Without that
       exception the gate fails on work this change does not own. Apply records the
       commit SHA, packages, and real pass/fail output to
       `<changeRoot>/.apply-test-record.md`, committed alongside the
       implementation. `/opsx:verify` check 6 consumes this record so a change
       whose code has not moved since does not pay for a second test run. A
       failure here pauses apply exactly as any other implementation issue would.
       See `.claude/commands/opsx/apply.md` for the full procedure.

       **2b. Fallback — executing-plans** (use ONLY when subagent
       support is unavailable):

       The superpowers:executing-plans SKILL.md itself states:
       "If subagents are available, use superpowers:subagent-
       driven-development instead of this skill." executing-plans
       exists for platforms or sessions without Task-tool /
       subagent support. On Claude Code, subagents ARE available,
       so this path should not be used under normal circumstances.

       If you must use 2b (e.g. running in a constrained runtime
       without subagent support), use the Skill tool to invoke
       **superpowers:executing-plans** and note that 2b does NOT
       transitively activate TDD or code-review. You are
       responsible for:
       - Following TDD discipline manually (the executor will
         not enforce it)
       - Invoking **superpowers:requesting-code-review** yourself
         after completing the plan, before proceeding to step 3

    3. **Verification and review**: When all tasks are done, run the
       `/opsx:verify` command to produce the `verify` artifact
       and check completeness, correctness, and coherence.
       Re-run verify until all blocking issues are resolved.

       Then run `/opsx:review` to produce the `review` artifact — the tuned
       code review over the branch diff, and its fix rounds. This is not a
       duplicate of the per-task and whole-implementation reviews
       `subagent-driven-development` already ran: those are generic, and this
       one runs the same stack-tuned prompt the merge-request pipeline
       enforces. `/opsx:archive` refuses to archive without its record.

    The memory ingest happens at archive, not here — see `/opsx:archive`.

    **If any skill invocation fails, STOP.**

    Report which skill is missing and print
    `claude plugin install superpowers@claude-plugins-official`. Never perform a
    missing skill's work manually: the execution discipline (TDD, subagent review,
    worktree isolation) is the reason this workflow exists, and silently
    substituting yourself for it produces a change that looks reviewed and is not.

    This governs a skill that is missing. It does not govern section 2b, where
    the skills are present and the runtime lacks subagent support — that path
    stays as written.
