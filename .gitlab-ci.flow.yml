# Agentic Dev Flow — GitLab CI fragment
#
# This is not a standalone pipeline. It is the flow-owned part of a project's
# .gitlab-ci.yml, extracted so it can be merged into a host project's pipeline.
# Everything else in the original file (build, deploy, installer, release,
# notify) belongs to the project, not to the flow, and is deliberately absent.
#
# How to adopt it, in a host .gitlab-ci.yml:
#
#   1. Add `ai-claude-inspect` to `stages:`, after the project's build stage.
#   2. Copy the `.mr_rules_no_draft` anchor and point every merge-request job
#      that should stay quiet on a draft at it: `rules: *mr_rules_no_draft`.
#      In the origin project that is the unit-test job and the build job.
#   3. Copy the `ai_claude_inspect` job. Repoint `needs:` at whichever job must
#      finish first in the host pipeline — the name below is the origin
#      project's build job and will not resolve elsewhere.
#   4. Set the CI variables listed under "Required CI variables" below.
#
# The behaviour this fragment implements is specified in
# openspec/specs/ai-review-ci-gate/spec.md (the gate) and
# openspec/specs/ci-unit-testing/spec.md (which stage runs which tests).
#
# Required CI variables:
#   AI_CLAUDE_INSPECT_ENABLED — the gate runs only when this is exactly "true"
#   ANTHROPIC_API_KEY         — consumed by infra/claude/review.sh
#   GITLAB_API_TOKEN          — read access to the merge request diff API
# Optional:
#   CLAUDE_MODEL              — defaults to the value set in review.sh
#   CLAUDE_MAX_TOKENS         — defaults to the value set in review.sh

stages:
  - ai-claude-inspect

# Draft merge requests stay quiet: the change workflow pushes several times per change
# (at propose, after each task group, and at archive), and a full pipeline per push
# would occupy the runner for work that is not finished. The pipeline runs in full once
# the merge request leaves draft, which /opsx:archive does before pushing the final
# commit.
.mr_rules_no_draft: &mr_rules_no_draft
  - if: $CI_MERGE_REQUEST_ID && $CI_MERGE_REQUEST_TITLE =~ /^(Draft:|\[Draft\]|WIP:|\[WIP\])/
    when: never
  - if: $CI_MERGE_REQUEST_ID && $CI_MERGE_REQUEST_TITLE =~ /\[skip-ci\]/i
    when: never
  - if: $CI_MERGE_REQUEST_ID

ai_claude_inspect:
  stage: ai-claude-inspect
  # Site-specific: name the runner that may reach the Anthropic API, or drop `tags`
  # entirely to use any available runner.
  tags:
    - your-runner-tag
  image:
    name: node:24-alpine3.21
  rules:
    - if: $CI_MERGE_REQUEST_IID && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" && $AI_CLAUDE_INSPECT_ENABLED == "true" && $CI_MERGE_REQUEST_TITLE !~ /^(Draft:|\[Draft\]|WIP:|\[WIP\])/ && $CI_MERGE_REQUEST_TITLE !~ /\[skip-ci\]/i
  before_script:
    - apk add --no-cache curl bash jq
  # Project-specific: repoint at the host pipeline's build job.
  needs:
    - buildonly_ansible
  script:
    - bash infra/claude/review.sh
  # Exit code 2 means the review could not run (GitLab or Anthropic unreachable).
  # That is a yellow pipeline, not a verdict about the code. Exit 1 is a real BLOCK
  # or REQUEST CHANGES verdict and fails the pipeline.
  allow_failure:
    exit_codes:
      - 2
  artifacts:
    paths:
      - claude-review.md
    expose_as: 'AI code review'
    expire_in: 7 days
    when: always
